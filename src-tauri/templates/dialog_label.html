<dialog id="dlg-label-preview">
  <button type="button" class="dlg-close" aria-label="Close">&times;</button>
  <h2>Label preview</h2>
  <p class="sub" id="label-preview-status">Rendering&hellip;</p>
  <div style="display:flex;justify-content:center;padding:1rem 0">
    <img id="label-preview-img" alt="Battery label preview"
         style="max-width:100%;background:#fff;border-radius:.4rem;image-rendering:pixelated">
  </div>
  <div class="row">
    <button type="button" id="label-save-btn" style="width:100%">Save as&hellip;</button>
  </div>
</dialog>
